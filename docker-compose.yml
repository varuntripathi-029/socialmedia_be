version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: socialmedia-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${LOCAL_POSTGRES_DB:-neondb}
      POSTGRES_USER: ${LOCAL_POSTGRES_USER:-neondb_owner}
      POSTGRES_PASSWORD: ${LOCAL_POSTGRES_PASSWORD:?set LOCAL_POSTGRES_PASSWORD in your .env file}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: socialmedia-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: always

volumes:
  postgres_data:
  redis_data:
