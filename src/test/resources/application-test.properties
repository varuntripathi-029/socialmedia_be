# -------------------------
# Test profile
# -------------------------
# Everything here exists to keep the suite off real infrastructure. The base
# application.properties points spring.datasource.* at ${DB_URL} (the live Neon database) and
# spring.data.redis.* at Upstash; profile-specific properties outrank the base file, so these
# overrides win and no test can reach production data even if a .env is present on the machine.

spring.datasource.url=jdbc:h2:mem:socialmedia-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN

# Redis is replaced by a mock in the tests themselves (@MockitoBean RedisTemplate), so nothing
# here ever opens a socket. The short timeout is belt-and-braces: if a test did somehow reach a
# real client, it fails fast instead of hanging the build.
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.timeout=100ms

# Spring Data Redis *repositories* are not used anywhere in this application — everything goes
# through RedisTemplate directly. Left enabled, its redisKeyValueAdapter calls
# getConnectionFactory() on the mocked template, gets null, and fails the context.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration

# Placeholder values for beans that require configuration at startup. None are exercised by the
# suite; they exist so the context can build without a .env file.
jwt.secret=test-secret-key-for-unit-tests-only-not-a-real-secret-value-padded-to-length
jwt.expiration=3600000
google.client.id=test-client-id
google.client.secret=test-client-secret
cloudinary.cloud-name=test-cloud
cloudinary.api-key=test-key
cloudinary.api-secret=test-secret
storage.provider=cloudinary
file.upload-dir=target/test-uploads
