server.port=${PORT:8080}

# -------------------------
# PostgreSQL Database Config
# -------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hikari connection pool (recommended)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# -------------------------
# JPA / Hibernate Config
# -------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# -------------------------
# Logging (use DEBUG only locally)
# -------------------------
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# -------------------------
# CORS Configuration
# -------------------------
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,https://socialmedia-fe-beta.vercel.app,https://socialmedia-fe-varun-tripathis-projects.vercel.app}

# -------------------------
# JWT Configuration
# -------------------------
jwt.secret=${JWT_SECRET}
jwt.expiration=2592000000

# -------------------------
# File Upload Config
# -------------------------
# Railway exposes the attached volume mount path via RAILWAY_VOLUME_MOUNT_PATH.
# Mount the volume to /app/uploads in Railway, and local dev will still fall back to ./uploads.
file.upload-dir=${RAILWAY_VOLUME_MOUNT_PATH:${FILE_UPLOAD_DIR:uploads}}

spring.servlet.multipart.max-file-size=7MB
spring.servlet.multipart.max-request-size=7MB

# -------------------------
# Google OAuth Configuration
# -------------------------
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}

# -------------------------
# Media Storage
# -------------------------
# Active FileStorageProvider implementation. Switch to "s3" (or any other provider you add)
# once an equivalent @Component implementing FileStorageProvider exists for it.
storage.provider=cloudinary

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

spring.datasource.hikari.connection-timeout=30000

# -------------------------
# Redis Configuration
# -------------------------
# Defaults match the local docker-compose Redis (no auth, no TLS). For a hosted provider like
# Upstash in production, set REDIS_HOST/PORT/PASSWORD and REDIS_SSL_ENABLED=true via env vars.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.data.redis.ssl.enabled=${REDIS_SSL_ENABLED:false}
spring.data.redis.timeout=300ms

